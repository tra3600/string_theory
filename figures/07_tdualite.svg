<text x='450.00' y='50.00' font-size='12.50' fill='#9aa4c7' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>m² = n²/R² + w²R² + 2(N+Ñ−2) : impulsion n et enroulement w s'échangent — au rayon auto-dual R = √α' surgit SU(2)×SU(2)</text>
